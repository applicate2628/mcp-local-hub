name: serena
description: "Semantic code toolkit — LSP-backed symbol search, references, and precise multi-file edits across your codebase."
kind: workspace-scoped
transport: native-http
command: uvx
base_args:
  - --from
  - git+https://github.com/oraios/serena@f0a3a279b7c48d28b9e7e4aea1ed9caed846906b
  - serena
  - start-mcp-server
  - --transport
  - streamable-http
# PYTHONUNBUFFERED disables Python's block-buffered stdout/stderr when
# the streams are redirected to a file (which they are: mcphub tees both
# into logs/serena-<daemon>.log). Without this, the codex daemon's
# silent crash at startup left no traceback because Python's 4KB
# buffers never flushed before exit. With unbuffered I/O the final
# stderr lines reach the log file and the failure is diagnosable.
env:
  PYTHONUNBUFFERED: "1"

# Router-native dynamic pool: ONE Serena daemon PER WORKSPACE, codex
# context for ALL clients. New installs are router-native from the start —
# every managed client points at the /serena/mcp router (no per-daemon
# client_bindings on the dynamic-pool shape), and the supervisor spawns one
# serena child per registered workspace from the daemon_template below.
#
# Why a single --context codex for every client (post-2026-05-20
# architectural review):
#
#   The pre-existing split (claude with --context claude-code + codex with
#   --context codex) wasted resources for two reasons:
#
#   1. Memory + process footprint: 2× Python + 2× SolidLSP + 2× internal
#      LSP children (clangd, tsserver, ...) at peak when both daemons had
#      the same project activated. ~400-800 MB overhead on a typical
#      multi-language project.
#
#   2. Functional asymmetry: claude-code preset (claude-code.yml at
#      pinned serena commit f0a3a279b7c48d28b9e7e4aea1ed9caed846906b)
#      has `single_project: true` AND EXCLUDES `search_for_pattern`.
#      That means the 6 claude-family agents could not switch projects
#      at all (activate_project tool not exposed) and lacked
#      search_for_pattern — degraded relative to codex.
#
#   By unifying everyone on --context codex:
#
#   - 1 process per workspace instead of 2 per client-context.
#   - search_for_pattern available to ALL agents (Codex's stats: 201
#     calls/month — actively used, not theoretical).
#   - activate_project available to ALL agents — claude-family agents
#     can switch between projects on demand, instead of being locked to
#     whatever project the daemon was bootstrapped on.
#
# The dynamic pool fronts every client through the /serena/mcp router, so a
# single context per workspace is structurally required (per-client context
# is unreachable through one router endpoint).
#
# The --context value lives SOLELY in daemon_template.context and is
# appended to each child argv at spawn — it MUST NOT appear in base_args or
# extra_args_template (the validator rejects a duplicate --context flag).
daemon_template:
  context: codex
  port_pool:
    start: 9150
    end: 9199
  extra_args_template:
    - --project
    - ${workspace.path}

## Antigravity's Cascade agent (Antigravity IDE v0.x as of 2026-04-17)
# silently drops loopback-HTTP MCP entries regardless of schema. Its HTTP
# support works only for remote HTTPS endpoints. Workaround: write a stdio
# entry to ~/.gemini/antigravity/mcp_config.json that spawns `mcphub.exe relay`
# as its child process. For the dynamic-pool serena the relay is written with
# `relay --url <…/serena/mcp>` pointing at the GUI's /serena/mcp router (set as
# the client entry's RelayURL by the migrate client-reconcile — design §5,
# internal/clients/antigravity.go's two relay shapes); the router resolves the
# per-workspace daemon (allocated from the daemon_template.port_pool above). The
# relay forwards JSON-RPC between Antigravity's stdin/stdout and the router. This
# restores shared-daemon benefits for multi-window Antigravity users without
# requiring Cascade to add loopback-HTTP support.
#
# See internal/clients/antigravity.go + internal/daemon/relay.go.

weekly_refresh: false
