name: mcp-language-server
kind: workspace-scoped
transport: stdio-bridge

# Default command/transport apply to 8 of 9 languages (the mcp-language-server
# backend). The `go` language overrides these via backend=gopls-mcp — see
# internal/daemon/backend_lifecycle.go (introduced in M2 Task 7) for dispatch.
command: mcp-language-server

port_pool:
  start: 9200
  end: 9299

# Phase 3 lazy mode: register() creates scheduler tasks for lazy proxies.
# Heavy backends spawn only on first tools/call. weekly_refresh restarts the
# PROXY; re-materialization of the backend happens on the next tools/call.
weekly_refresh: false

# 9 supported languages. All v1 entries use transport: stdio. The lazy proxy
# dispatches on backend+transport at materialization time; changing to
# http_listen or native_http is a future follow-up.
languages:
  - name: clangd
    backend: mcp-language-server
    transport: stdio
    lsp_command: clangd
    project_markers: [compile_commands.json, .clangd]
    required_binaries: [clangd]

  - name: fortran
    backend: mcp-language-server
    transport: stdio
    lsp_command: fortls
    # fpm.toml is the Fortran Package Manager manifest; .fortlsrc / .fortls.json /
    # .fortls are fortls's three default config-file names, discovered in that
    # order under the project root (https://fortls.fortran-lang.org/options.html).
    # CMake/Make-based Fortran projects (the common case for scientific codes) do
    # not use fpm; fortls parses source directly (no compile DB needed, unlike
    # clangd), so any one of its config files (even an empty {}) opts a project
    # into fortls auto-register.
    project_markers: [fpm.toml, .fortlsrc, .fortls.json, .fortls]
    required_binaries: [fortls]

  - name: go
    backend: gopls-mcp
    transport: stdio
    lsp_command: gopls
    extra_flags: [mcp]
    project_markers: [go.mod]
    required_binaries: [gopls]

  - name: javascript
    backend: mcp-language-server
    transport: stdio
    lsp_command: typescript-language-server
    extra_flags: ["--stdio"]
    project_markers: [package.json, tsconfig.json, jsconfig.json]
    required_binaries: [typescript-language-server]

  - name: python
    backend: mcp-language-server
    transport: stdio
    lsp_command: pyright-langserver
    extra_flags: ["--stdio"]
    project_markers: [pyproject.toml, setup.py, setup.cfg]
    required_binaries: [pyright-langserver]

  - name: rust
    backend: mcp-language-server
    transport: stdio
    lsp_command: rust-analyzer
    project_markers: [Cargo.toml]
    required_binaries: [rust-analyzer]

  - name: typescript
    backend: mcp-language-server
    transport: stdio
    lsp_command: typescript-language-server
    extra_flags: ["--stdio"]
    project_markers: [package.json, tsconfig.json, jsconfig.json]
    required_binaries: [typescript-language-server]

  - name: vscode-css
    backend: mcp-language-server
    transport: stdio
    lsp_command: vscode-css-language-server
    extra_flags: ["--stdio"]
    project_markers: [package.json]
    required_binaries: [vscode-css-language-server]

  - name: vscode-html
    backend: mcp-language-server
    transport: stdio
    lsp_command: vscode-html-language-server
    extra_flags: ["--stdio"]
    project_markers: [package.json]
    required_binaries: [vscode-html-language-server]
