# fetch — the official mcp-server-fetch (fetches arbitrary HTTP URLs, returns content).
# Wrapped by mcphub as an HTTP daemon (stdio-bridge) so every client reaches it via the hub.
#
# Restored + committed 2026-06-10: the prior fetch manifest was LOCAL-ONLY (never in git) and
# got lost on a working-tree reset, leaving the client entries pointing at a dead port
# (the old unified-serena port) — `claude mcp list` showed `fetch ✘ Failed`. Committing
# the manifest so it survives resets and `mcphub install --server fetch` can always
# re-materialize it.
name: fetch
description: "Fetch a web page and convert it to clean markdown for the model to read."
kind: global
command: uvx
base_args:
  - --with
  - mcp==1.28.1
  - mcp-server-fetch@2026.7.10
transport: stdio-bridge
daemons:
  - name: default
    port: 9133
client_bindings:
  - client: claude-code
    daemon: default
    url_path: /mcp
  - client: codex-cli
    daemon: default
    url_path: /mcp
  - client: cursor
    daemon: default
    url_path: /mcp
