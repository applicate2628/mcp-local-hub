name: vtune
description: "Intel VTune Profiler MCP server (vtune) — profile a target exe under VTune and report top hotspots + a summary. DISABLED by default; set MCP_LOCAL_HUB_ENABLE_UNSAFE_VTUNE=1 to opt in (runs a caller-supplied executable)."
kind: global
transport: stdio-bridge
command: mcphub
base_args:
  - vtune

# vtune_profile executes a caller-supplied target executable under VTune — the
# same arbitrary-local-code-execution class as oneapi-run / drmemory (the client
# picks any on-disk exe and it runs with the user's privileges). SECURE BY
# DEFAULT: the tool is NOT registered unless the operator sets
# MCP_LOCAL_HUB_ENABLE_UNSAFE_VTUNE=1. The committed default is "0"; an operator
# who accepts the risk opts in per host (edit here, or override the daemon env
# via the overlay). The daemon still runs when disabled, it just registers no
# tool.
env:
  MCP_LOCAL_HUB_ENABLE_UNSAFE_VTUNE: "0"

# VTune Profiler MCP server: runs a target binary under Intel VTune
# (`-collect <type>` then `-report -format=csv`) and parses the top
# hotspots + summary. Lives inside the mcphub binary — one hub-managed
# daemon shared across all MCP clients via HTTP multiplexing through the
# stdio-bridge transport. Mirrors the drmemory / godbolt global-daemon shape.
# The profiled target runs under the full oneAPI runtime env (shared
# oneapi.SetvarsEnv) so an icx-built / MKL-linked target loads its DLLs.

daemons:
  - name: default
    port: 9136

client_bindings:
  - client: claude-code
    daemon: default
    url_path: /mcp
  - client: codex-cli
    daemon: default
    url_path: /mcp
  - client: cursor
    daemon: default
    url_path: /mcp
  - client: vscode
    daemon: default
    url_path: /mcp
  - client: gemini-cli
    daemon: default
    url_path: /mcp
  - client: qwen-cli
    daemon: default
    url_path: /mcp
  - client: antigravity
    daemon: default
    url_path: /mcp

weekly_refresh: false
