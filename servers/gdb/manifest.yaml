name: gdb
description: "GDB debugger bridge — drive GDB sessions (breakpoints, stepping, inspection) over MCP."
kind: global
transport: stdio-bridge
required_binaries: [gdb]
command: mcphub
base_args:
  - "gdb-bridge"

# Native Go GDB/MI bridge (internal/gdb), replacing the former external GDB-MCP
# python server (`uv run … server.py`). GDB-MCP decided availability with a bare
# `subprocess.run(['gdb','--version'])` that fails inside the console-less mcphub
# daemon even when gdb is installed + on PATH, AND its lldb submodule needed lldb
# python bindings absent from the uv venv. The native bridge spawns gdb by an
# absolute path (toolchain.DefaultGdbPath) via Go exec — which works in the
# console-less daemon — and drives it over GDB/MI. Tools: gdb_start / gdb_command
# / gdb_terminate / gdb_list_sessions / debugger_status (the gdb_* names match
# GDB-MCP so existing clients keep working). Session management is in-process:
# each client call carries a session_id; one daemon serves N concurrent sessions.
# LLDB is served by mcphub's own native lldb daemon (servers/lldb +
# internal/lldb/bridge.go), so this server is gdb-only.

daemons:
  - name: default
    port: 9129

client_bindings:
  - client: claude-code
    daemon: default
    url_path: /mcp
  - client: codex-cli
    daemon: default
    url_path: /mcp
  - client: cursor
    daemon: default
    url_path: /mcp
  - client: vscode
    daemon: default
    url_path: /mcp
  - client: gemini-cli
    daemon: default
    url_path: /mcp
  - client: qwen-cli
    daemon: default
    url_path: /mcp
  - client: antigravity
    daemon: default
    url_path: /mcp

weekly_refresh: false
