name: gdb
kind: workspace-scoped
transport: stdio-bridge
command: uv
base_args:
  - "run"
  - "--directory"
  - "${HOME}/.local/mcp-servers/GDB-MCP"
  - "python"
  - "server.py"

# Security note: this server remains workspace-scoped while hub-level
# authentication/ownership checks for shared daemon POST requests are pending.

daemons:
  - name: default
    port: 9129

client_bindings:
  - client: claude-code
    daemon: default
    url_path: /mcp
  - client: codex-cli
    daemon: default
    url_path: /mcp
  - client: gemini-cli
    daemon: default
    url_path: /mcp
  - client: antigravity
    daemon: default
    url_path: /mcp

weekly_refresh: false
