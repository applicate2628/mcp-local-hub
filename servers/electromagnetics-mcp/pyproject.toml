[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcphub-electromagnetics-mcp"
version = "0.1.0"
description = "Operator-owned MCP servers for Ansys HFSS/AEDT and CST Studio Suite"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MPL-2.0" }
dependencies = [
  "mcp>=1.29.0,<1.30",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
]

[project.scripts]
mcphub-hfss-mcp = "mcphub_em_mcp.hfss:main"
mcphub-cst-mcp = "mcphub_em_mcp.cst:main"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcphub_em_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
