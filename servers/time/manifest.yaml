name: time
description: "Time and timezone utilities — current time, conversions, and timezone-aware calculations."
kind: global
transport: stdio-bridge
command: npx
base_args:
  - "-y"
  - "@mcpcentral/mcp-time@0.0.5"

daemons:
  - name: default
    port: 9128

client_bindings:
  - client: claude-code
    daemon: default
    url_path: /mcp
  - client: codex-cli
    daemon: default
    url_path: /mcp
  - client: cursor
    daemon: default
    url_path: /mcp
  - client: vscode
    daemon: default
    url_path: /mcp
  - client: gemini-cli
    daemon: default
    url_path: /mcp
  - client: qwen-cli
    daemon: default
    url_path: /mcp
  - client: antigravity
    daemon: default
    url_path: /mcp

weekly_refresh: false
