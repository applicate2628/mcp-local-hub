name: CI

# Cross-platform build + test matrix. Catches Linux regressions early
# so the project stays Linux-server-deployable (per Phase 3B-II §F1-F7
# roadmap in docs/superpowers/plans/phase-3b-ii-backlog.md).
#
# CI minute budget is tight. CI does NOT auto-trigger on PRs — open a PR,
# iterate locally with `go test ./...`, then explicitly request CI ONLY
# when the work is finished and you want a final cross-platform sweep
# before merge. This keeps GitHub Actions minutes free for the moments
# that actually need them.
#
# How to trigger CI on a PR or branch:
#
#   1. Actions tab → "CI" workflow → "Run workflow" → pick branch.
#   2. Or from CLI:  `gh workflow run ci.yml --ref <branch> -f reason=<why>`
#
# CI also runs automatically on pushes to master (post-merge sanity check
# so a broken main is caught immediately), and on tag pushes (release
# verification). Neither path adds noise during the normal review loop.
#
# Job split:
#   - build-and-test: ubuntu-latest + windows-latest. Each runs
#     `go vet ./...`, `go build ./...`, `go test ./...`. Build-tag
#     splits in the codebase (//go:build windows / !windows) ensure
#     each runner only compiles the relevant platform paths.
#   - cross-compile: ubuntu-latest cross-builds for darwin/amd64 and
#     darwin/arm64 to catch macOS regressions without spinning up a
#     macos-latest runner (those minutes cost 10x more on GitHub-hosted).
#
# Out of scope here:
#   - E2E browser tests live under internal/gui/e2e/ and are pinned to
#     windows-latest in a separate workflow (see CLAUDE.md). The
#     scheduler.New() stub returns "not implemented" on non-Windows,
#     which 500s /api/status — those tests can't run on ubuntu yet.

on:
  # Manual trigger — the primary path for PR review checkpoints. Pass a
  # short reason so the run history is self-documenting.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why running CI now (review checkpoint, pre-merge, etc.)"
        required: false
        default: "manual"

  # Run on master after merge to catch regressions in the main branch
  # immediately. This is the safety net that makes the manual-only PR
  # model OK — even if reviewers forget to manually run CI before merge,
  # this catches a broken master within minutes.
  push:
    branches: [master]
    tags: ["v*"]

# Cancel superseded runs on the same ref. Useful when triggering manually
# multiple times on the same branch — the latest manual request wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify Go modules tidy
        # Ensures go.mod/go.sum are up-to-date. Catches any forgotten
        # `go mod tidy` after dep changes.
        run: |
          go mod download
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # -count=1 disables the test result cache so we always re-run
        # against the current source. CI minutes are the cost; signal
        # is worth it.
        run: go test -count=1 -timeout 5m ./...

      - name: Test (env-fallback build tag)
        # Plan v13 §43: the env-fallback state-path resolver lives behind
        # the test_state_path_env build tag (state_paths_envfallback.go).
        # The default-tag Test step above exercises the production
        # fail-closed path; this step exercises the tagged env-fallback
        # path so both variants stay green. Scoped to the packages whose
        # tests depend on the tag (internal/api state-path tests +
        # internal/cli subprocess-isolation tests) — matches the local
        # pre-push command in CLAUDE.md Step 1.
        run: go test -tags=test_state_path_env -count=1 -timeout 5m ./internal/api/ ./internal/cli/

      - name: Production binary symbol assertion
        # Plan v13 §43/§50: a normal `go build` (no -tags) MUST exclude
        # the env-fallback state-path resolver. The build-tag file split
        # (state_paths_prod.go is //go:build !test_state_path_env,
        # state_paths_envfallback.go is //go:build test_state_path_env)
        # makes this a compile-time guarantee; this step is the
        # defense-in-depth CI gate that catches any future erosion of the
        # tag discipline. resolveKnownFolderWithEnvFallback is the symbol
        # unique to the env-fallback variant (the production variant
        # defines resolveKnownFolderProduction instead), so its presence
        # in a no-tag build means a test-only path leaked into production.
        # `shell: bash` keeps one script across the ubuntu + windows
        # matrix (Git Bash ships on windows-latest); GOEXE handles the
        # .exe suffix difference.
        shell: bash
        run: |
          ext="$(go env GOEXE)"
          bin="mcphub-prod${ext}"
          go build -o "${bin}" ./cmd/mcphub
          if go tool nm "${bin}" | grep -q 'resolveKnownFolderWithEnvFallback'; then
            echo "FAIL: production binary contains the env-fallback symbol resolveKnownFolderWithEnvFallback (test-only state-path resolver leaked into a no-tag build)"
            exit 1
          fi
          echo "OK: production binary excludes the test-only env-fallback state-path resolver"

      - name: GUI bundle freshness
        # The embedded GUI bundle (internal/gui/assets/{index.html,app.js,
        # style.css}) is committed so `go build` works without Node. It
        # can silently drift from the frontend source if a contributor
        # edits internal/gui/frontend/ without re-running
        # `go generate ./internal/gui/...`. Regenerate here and fail if
        # the committed bundle differs from a fresh build. Gated to the
        # ubuntu matrix leg only: the npm+vite build is the same on every
        # OS, so running it once is enough, and a Windows leg would risk
        # CRLF-only diff false-positives against the LF-committed assets.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate + verify embedded GUI bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --prefix internal/gui/frontend
          go generate ./internal/gui/...
          git diff --exit-code internal/gui/assets/

  cross-compile:
    name: cross-compile (darwin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./...

      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...

  # Linux integration depth — exercises //go:build linux paths beyond
  # the unit-test matrix's basic build/vet/test. Covers Task 13.1
  # cold-start reaper, pdeathsig direct-child supervision, and (when
  # systemd-user is available in the runner image) the --linux-managed
  # systemd-user-service smoke. Linux remains beta in v0.5.0 (Q9).
  linux-integration:
    name: Linux integration tests
    runs-on: ubuntu-latest
    needs: build-and-test  # Don't run integration on top of broken unit tests.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Linux-tagged go test
        run: go test -count=1 -timeout 5m -tags=linux_integration ./internal/cli/ ./internal/process/
      - name: systemd-user smoke (skipped if not present)
        run: |
          if command -v systemctl >/dev/null 2>&1 && systemctl --user status >/dev/null 2>&1; then
            echo "systemd-user available — running smoke"
            go test -count=1 -timeout 2m -tags=linux_systemd_smoke ./internal/autostart/
          else
            echo "systemd-user unavailable in this runner image — skipping per Linux-beta policy"
          fi
