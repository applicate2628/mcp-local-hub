# npm publish — build the release's admitted platform payload, inject it
# into its @applicate2628/mcp-local-hub-<plat>-<arch> sub-package, and publish
# the platform package before the `mcp-local-hub` meta to the public
# npm registry with Sigstore provenance. The meta's optionalDependencies pull
# the matching platform package at `npm install -g mcp-local-hub` time.
# The installed command is `mcphub`; postinstall only canonicalizes eligible
# global installs and does not download a payload.
#
# Triggers:
#   - push a tag `vX.Y.Z` (or `vX.Y.Z-beta.N`) → real publish (prereleases go to
#     the `beta` dist-tag, not `latest`).
#   - workflow_dispatch → manual run; default dry_run=true validates the whole
#     pipeline (build + pack) WITHOUT publishing. Run this once before the first
#     real tag.
#
# Authentication: npm Trusted Publishing exchanges this GitHub-hosted job's
# OIDC identity for short-lived package-bound publish authority. Each of the
# published packages must separately trust applicate2628/mcp-local-hub and this
# workflow filename with no environment. Missing or mismatched trust must fail
# the publish; there is no long-lived publishing-token fallback.
#
# SECURITY: untrusted / template values (inputs.version, github.event_name,
# steps.ver.outputs.version, inputs.dry_run) are routed through `env:` blocks
# and consumed as quoted shell variables — never expanded as `${{ }}` source
# text directly inside a `run:` body (the GitHub Actions script-injection
# class). The version is also semver-gated before any downstream use.
name: npm publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.4.6-beta.0)'
        required: true
      dry_run:
        description: 'Dry-run (build + npm pack, no publish)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing OIDC + Sigstore provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify Trusted Publishing toolchain
        shell: bash
        run: |
          if [ "$(node --version)" != "v24.21.0" ]; then
            echo "::error::expected Node v24.21.0"; exit 1
          fi
          if [ "$(npm --version)" != "11.19.0" ]; then
            echo "::error::expected npm 11.19.0"; exit 1
          fi

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"   # v0.5.0 -> 0.5.0
          else
            V="$VERSION_INPUT"
          fi
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$V' is not semver"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $V"

      - name: Set package versions + regenerate platform packages
        id: package_set
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          V="$VERSION"
          node -e "const f='npm/package.json';const p=require('./'+f);p.version='$V';for(const k in p.optionalDependencies)p.optionalDependencies[k]='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          node npm/generate-platform-packages.js
          node npm/sync-version.js --inject   # push $V into build.sh + versioninfo.json so the binary matches
          TARGETS="$(node -e "process.stdout.write(Object.keys(require('./npm/lib/platform-binary').PACKAGE_BY_PLATFORM).join(' '))")"
          if [ "$TARGETS" != "win32-x64" ]; then
            echo "::error::this release workflow admits only win32-x64; manifest targets: $TARGETS"; exit 1
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Build the admitted Windows x64 payload
        id: native
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TARGETS: ${{ steps.package_set.outputs.targets }}
        run: |
          V="$VERSION"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'commit=%s\nbuild_date=%s\n' "$COMMIT" "$DATE" >> "$GITHUB_OUTPUT"
          for d in $TARGETS; do
            case "$d" in
              win32-x64)
                pwsh -NoProfile -File ./build.ps1 \
                  -WindowsTargetArch amd64 \
                  -OutputDirectory "npm/packages/$d/bin" \
                  -ReleaseVersion "$V" \
                  -ReleaseCommit "$COMMIT" \
                  -ReleaseBuildDate "$DATE"
                ;;
              *) echo "::error::no admitted build route for $d"; exit 1 ;;
            esac
            ls -l "npm/packages/$d/bin/"
          done

      - name: Assert the Windows product identity manifest
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.native.outputs.commit }}
          BUILD_DATE: ${{ steps.native.outputs.build_date }}
          TARGETS: ${{ steps.package_set.outputs.targets }}
        run: |
          windows_product_rows() {
            node <<'NODE'
          const contract = require('./windows-product-artifacts.json');
          for (const artifact of contract.artifacts.filter((row) => row.productMetadata === true)) {
            process.stdout.write(`${artifact.role}\t${artifact.filename}\n`);
          }
          NODE
          }
          WINDOWS_PRODUCT_ROWS="$RUNNER_TEMP/mcphub-windows-product-artifacts.tsv"
          windows_product_rows > "$WINDOWS_PRODUCT_ROWS"
          if [ "$(wc -l < "$WINDOWS_PRODUCT_ROWS")" -ne 1 ]; then
            echo "::error::Windows artifact contract did not emit exactly one metadata-bearing product row"; exit 1
          fi
          for target in $TARGETS; do
            while IFS=$'\t' read -r role filename; do
              candidate="npm/packages/$target/bin/$filename"
              observed="$RUNNER_TEMP/$target-windows-product-identity.json"
              go run ./tools/windows-product-validate \
                --candidate "$candidate" \
                --expected-version "$VERSION" \
                --expected-commit "$COMMIT" \
                --expected-build-date "$BUILD_DATE" > "$observed"
              cmp "$observed" "npm/packages/$target/bin/windows-product-identity.json"
              echo "$target role=$role metadata version=$VERSION commit=$COMMIT buildDate=$BUILD_DATE"
            done < "$WINDOWS_PRODUCT_ROWS"
          done

      - name: Verify staged npm package payloads
        shell: bash
        env:
          PACK_EVIDENCE: ${{ runner.temp }}/mcphub-pack-evidence
          TARGETS: ${{ steps.package_set.outputs.targets }}
        run: |
          mkdir -p "$PACK_EVIDENCE"
          for d in $TARGETS; do
            (cd "npm/packages/$d" && npm pack --dry-run --json) > "$PACK_EVIDENCE/$d.json"
          done
          (cd npm && npm pack --dry-run --json) > "$PACK_EVIDENCE/meta.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.PACK_EVIDENCE;
          const contract = require('./windows-product-artifacts.json');
          const windowsNative = [
            ...contract.artifacts
              .filter((artifact) => artifact.npmPayload === true)
              .map((artifact) => `bin/${artifact.filename}`),
            `bin/${contract.identityManifest.filename}`,
          ].sort();
          const targets = Object.keys(require('./npm/lib/platform-binary').PACKAGE_BY_PLATFORM);
          if (targets.join(' ') !== process.env.TARGETS) throw new Error('workflow target projection drift');
          for (const target of targets) {
            const rows = JSON.parse(fs.readFileSync(path.join(root, `${target}.json`), 'utf8'));
            if (!Array.isArray(rows) || rows.length !== 1) throw new Error(`${target}: expected one pack result`);
            const files = rows[0].files.map((f) => f.path);
            const count = (name) => files.filter((p) => p === name).length;
            const native = files.filter((p) => p.startsWith('bin/')).sort();
            if (JSON.stringify(native) !== JSON.stringify(windowsNative) || windowsNative.some((p) => count(p) !== 1)) {
              throw new Error(`${target}: Windows native payload drift: ${files.join(', ')}`);
            }
            process.stdout.write(`${target}: ${files.join(', ')}\n`);
          }
          const metaRows = JSON.parse(fs.readFileSync(path.join(root, 'meta.json'), 'utf8'));
          if (!Array.isArray(metaRows) || metaRows.length !== 1) throw new Error('meta: expected one pack result');
          const metaFiles = metaRows[0].files.map((f) => f.path).sort();
          const expectedMeta = ['README.md', 'bin/cli.js', 'lib/platform-binary.js', 'package.json', 'scripts/postinstall.js'];
          if (JSON.stringify(metaFiles) !== JSON.stringify(expectedMeta)) {
            throw new Error(`meta payload drift: ${metaFiles.join(', ')}`);
          }
          const meta = require('./npm/package.json');
          const deps = meta.optionalDependencies;
          if (JSON.stringify(deps) !== JSON.stringify({'@applicate2628/mcp-local-hub-win32-x64': meta.version})) {
            throw new Error(`meta optional dependencies drift: ${JSON.stringify(deps)}`);
          }
          process.stdout.write(`meta: ${metaFiles.join(', ')}\n`);
          NODE

      - name: Publish platform packages, then the meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.ver.outputs.version }}
          TARGETS: ${{ steps.package_set.outputs.targets }}
        run: |
          V="$VERSION"
          DRY=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            DRY="--dry-run"
            echo "DRY-RUN: building + packing only, no publish."
          fi
          TAG=""
          case "$V" in *-*) TAG="--tag beta";; esac   # prerelease -> beta dist-tag, never latest
          # Platform packages FIRST so the meta's optionalDependencies resolve.
          for d in $TARGETS; do
            echo "::group::publish @applicate2628/mcp-local-hub-$d"
            ( cd "npm/packages/$d" && npm publish --provenance --access public $TAG $DRY )
            echo "::endgroup::"
          done
          echo "::group::publish meta mcp-local-hub"
          ( cd npm && npm publish --provenance --access public $TAG $DRY )
          echo "::endgroup::"
